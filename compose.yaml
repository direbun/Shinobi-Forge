services:
  shinobi-forge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shinobi-forge
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"
    networks:
      - cloudflare-tunnel
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  cloudflare-tunnel:
    external: true
    name: ${CLOUDFLARE_TUNNEL_NETWORK:-cloudflare}
